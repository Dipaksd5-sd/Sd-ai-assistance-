name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave blank for auto-generated tag)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'SD Assistant Debug APK'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Setup Keystore & Environment (.env)
        run: |
          echo "=== Configuring Build Environment ==="

          # Restore or generate debug.keystore required by app/build.gradle.kts
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Configure .env for Secrets Gradle Plugin
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Injecting GEMINI_API_KEY from GitHub Secrets..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f ".env.example" ]; then
            echo "Falling back to .env.example..."
            cp .env.example .env
          else
            echo "Creating empty .env..."
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Build Debug APK with Gradle
        run: |
          echo "=== Starting Gradle assembleDebug ==="
          gradle :app:assembleDebug --stacktrace --scan-off

      - name: Prepare & Verify Artifacts
        id: prepare_apk
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          RAW_APK="$APK_DIR/app-debug.apk"
          OUTPUT_APK="$APK_DIR/SD-Assistant-debug.apk"

          if [ ! -f "$RAW_APK" ]; then
            echo "Error: Generated APK not found at $RAW_APK"
            exit 1
          fi

          cp "$RAW_APK" "$OUTPUT_APK"
          APK_SIZE=$(du -h "$OUTPUT_APK" | cut -f1)
          APK_SHA=$(sha256sum "$OUTPUT_APK" | cut -d ' ' -f1)

          echo "APK generated successfully: $OUTPUT_APK ($APK_SIZE)"
          echo "SHA256: $APK_SHA"

          # Determine Tag & Title
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-build-${{ github.run_number }}"
          fi

          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "apk_sha=$APK_SHA" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SD-Assistant-debug-apk
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Determine if Release Should Be Created
        id: check_release
        run: |
          SHOULD_RELEASE="false"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.create_release }}" = "true" ]; then
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "push" ] && ([ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]); then
            SHOULD_RELEASE="true"
          fi
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.prepare_apk.outputs.release_tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare_apk.outputs.release_tag }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          generate_release_notes: true
          body: |
            ### 🤖 SD Assistant — Native Android Voice Assistant
            **Automated Build Artifact**

            - **File:** `SD-Assistant-debug.apk`
            - **Size:** `${{ steps.prepare_apk.outputs.apk_size }}`
            - **SHA-256:** `${{ steps.prepare_apk.outputs.apk_sha }}`
            - **Commit:** `${{ github.sha }}`
            - **Build Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            #### ✨ Highlights
            - Real-time bidirectional voice assistant powered by **Gemini Live API**.
            - Native Android device actions (Camera, Flashlight, Battery, YouTube, Settings).
            - Instant user interruption with bilateral audio streaming.
            - Futuristic animated SD Orb interface built with Jetpack Compose.
